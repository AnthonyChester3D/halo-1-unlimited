# opence.ini: every Halo 1 Unlimited setting, with its default
#
# Put it beside the game's default.xbe. A copy in E:\TDATA\4c4a4855 (the game's own storage) is read after it,
# and its lines win.
# A setting is a line "name = value". Lines starting with # are ignored, so everything below is at its default
# until you delete the # in front of a setting and change its value.
# The game reads only the first 8 KB of this file.

# ---------- Updates

# Look for a new release once a boot and offer it on the main menu. 0: never. 2: on test builds too.
#update_check = 1

# ---------- Online

# Internet play (ONLINE PLAY in the menus). 0: off.
#online = 1
# PC (OpenCE) games in the online list, and this Xbox's games shown to PCs. 0: Xbox games only.
#crossplay = 1
# Ask the router (UPnP) to forward the tunnel's port. 0: don't.
#online_upnp = 1
# The UDP port internet play uses. 0: the game picks one. Forward it on your router if UPnP doesn't.
#online_tunnel_port = 0
# The lobby servers: host:port, separated by commas, no spaces. Set, it's used instead of brokers.txt beside
# the XBE (default: that file, else OpenCE's four, below).
#online_brokers = opence.milenko.org:1883,broker.emqx.io:1883,broker.hivemq.com:1883,test.mosquitto.org:1883
# The STUN servers that tell the game its public address.
#online_stun = stun.l.google.com:19302,stun.cloudflare.com:3478

# ---------- Showcase (the main menu's screensaver: a bot match with camera shots)

# 0: Halo's attract movies instead.
#showcase = 1
# Seconds the main menu waits for a press before it starts (5 and up).
#showcase_seconds = 75
# Each map plays at most this many seconds (15 to 3600). 0: no limit.
#showcase_map_seconds = 90
# Its bots, 0 to 15. Not set: the map's suggested players (4 to 10) less one.
#showcase_bots = 7
# Bots drop out one at a time while it runs under this many frames a second. 0: never.
#showcase_min_fps = 15
# White on a map in the map list previews its showcase.
#showcase_preview = 0
# The bot trainer: every map of showcase_playlist.ini plays for showcase_train_minutes so bots learn the maps
# (saved to bots_learned.txt / T:\bots_<map>.txt). showcase_seconds = 5 starts it soon after boot.
#showcase_train = 0
#showcase_train_minutes = 10

# ---------- Testing and map work

# The frame rate in the bottom right corner.
#fps_counter = 0
# A test, for comparing frame rates: the 3D view drawn at this percent of the screen (1 to 99) and stretched to it;
# the HUD and menus stay sharp. One player only (not split screen); a few effects may sit a little off. 0: off.
# With perf_sweep: a pass of its own, rows in perf\sweep_r<scale>.csv, only perf\sweep_list.txt's maps if it's there.
#res_scale = 0
# A test: Direct3D's push buffer (the graphics chip's command queue) in KB, 128 to 1024 in steps of 32; Halo's is
# 512. Each KB less is a KB more free memory; too small and the game waits on the graphics chip. 0: Halo's.
#push_buffer_kb = 0
# Check every folder map in the background; the results go in map_check.txt.
#map_check = 0
# The bots' log: a line every 10 seconds in oxbox_log.txt, and opence_bot_log.txt (where bots gave up).
#bot_log = 0
# An FTP server on the game's folder while the menus are up (stopped while a map plays).
#ftp = 0
#ftp_password = xbox
#ftp_port = 21
# 0: no DirectSound effects (the audio chip's reverb), for a BIOS that doesn't take them.
#audio_effects = 1

# ---------- Developers

# The performance and memory log: a CSV file per map in perf\ beside the XBE.
#perf_log = 0
# A frame longer than this many milliseconds gets a line of its own.
#perf_slow_frame_ms = 34
# How full the game state's pools (actors, props, objects, particles, script threads...) have been this map: a
# "pools:" line every 10 seconds of a game in oxbox_log.txt. Always written, at no cost: a "limit:" line the first
# time in a map one of them (or the sound or texture cache) is full, a "checkpoint:" line for each save and revert,
# "crash:"/"halt:" lines with the call chain, and a "bookmark N:" line when both thumbsticks are clicked together.
#log_pools = 0
# How often (ms, up to 100) the graphics chip is asked whether it's busy. 0: never.
#perf_gpu_sample_ms = 1
# In another's game (system link or online), the other players' bodies far from yours, or out of your sight, are
# updated as often as the host sends them (every 2nd to 6th tick), which saves most of a big game's time on them;
# anyone near you or in your sights every tick. 0: every player every tick, as before v1.195.
#far_players = 1
# In multiplayer, a dead body that has lain still for 5 seconds isn't updated until something moves it (a game keeps
# up to 50 per 16 players, and each cost about half a live player every tick). 0: every tick, as before v1.195.
#resting_corpses = 1
# In multiplayer, a weapon lying still on the ground with nothing going on in it (not hot, not charging, not the
# game type's flag or ball) isn't updated until it's picked up or moved. 0: every tick, as before v1.196.
#resting_weapons = 1
# A vehicle parked with nobody in it, a grenade or powerup lying still, and scenery that neither animates nor has
# functions aren't updated, once idle 5 seconds, until something wakes them (getting in, a push, damage, an
# animation): nothing changes in them, yet each cost about as much as one that moves. And a light that's off (a
# flashlight) stays where it is in the map until it's on. The campaign's too. 0: every tick, as before v1.200.
#resting_objects = 1
# The perf sweep: 60 s runs of each map (multiplayer: no bots, 4, its suggested count; a campaign level: its start),
# rows in perf\sweep.csv, the master table (tools/perf_sweep_report.py). In order: perf\sweep_priority.txt's maps
# (a key a line) not measured at this build's sweep version; maps never measured, new map versions too; maps measured
# at an older sweep version that weren't perfect, the slowest first. A press pauses it. perf_sweep_detail = 1 also
# keeps each run's per-second CSV. perf_sweep_redo = 1: the perfect ones are measured again too. A file named
# nosweep in a pack's folder (maps\<pack>\nosweep) leaves that pack's maps out.
#perf_sweep = 0
#perf_sweep_detail = 0
#perf_sweep_seconds = 60
# The sweep's scaling runs: a map under 29 fps, the graphics chip busy, plays its slowest run again drawn at 85%, and
# at 70% if that's still under 29 (perf_sweep_report.py shows whether fewer pixels helped). 0: off.
#perf_sweep_scaling = 1
#perf_sweep_redo = 0
# An experiment of its own (1-99): rows in perf\sweep_p<pass>.csv, only perf\sweep_list.txt's maps if it's there, no
# scaling runs. Not needed day to day: the master table re-checks slow maps when the sweep version goes up.
#perf_sweep_pass = 0
# The network test's lines on the main menu as well as in oxbox_log.txt.
#net_test_screen = 0
# The network test at start-up (DNS, STUN, the brokers), and XNet's security bypass for it.
#net_test = 1
#net_test_bypass = 1
# Join the first Xbox game listed online, to test the tunnel.
#net_test_join = 0
# A PC running the test's listener script, and its port.
#net_test_host = 192.168.1.10
#net_test_port = 5555
# Another DNS server for the test (default 8.8.8.8, then 1.1.1.1).
#net_test_dns = 8.8.8.8
# A fixed address (in its 255.255.255.0 network), no router.
#net_test_static = 192.168.1.20

# ---------- Other files the game reads

# showcase_playlist.ini        written by the game at the main menu: which maps the showcase and the trainer play
# d:\maps\bots\<map>.txt       bot nodes and links added to a stock map (never written by the game)
# <map folder>\bots.txt        the same for a folder map
# opence_settings.txt          written by the game's menus: leave it alone
