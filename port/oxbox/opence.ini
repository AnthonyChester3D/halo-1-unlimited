# opence.ini: every Halo 1 Unlimited setting, with its default
#
# Put it beside the game's default.xbe. A copy in E:\TDATA\4c4a4855 (the game's own storage) is read after it,
# and its lines win.
# A setting is a line "name = value". Lines starting with # are ignored, so everything below is at its default
# until you delete the # in front of a setting and change its value.
# The game reads only the first 8 KB of this file.

# ---------- Updates

# Look for a new release once a boot and offer it on the main menu. 0: never. 2: on test builds too.
#update_check = 1

# ---------- Online

# Internet play (ONLINE PLAY in the menus). 0: off.
#online = 1
# PC (OpenCE) games in the online list, and this Xbox's games shown to PCs. 0: Xbox games only.
#crossplay = 1
# Ask the router (UPnP) to forward the tunnel's port. 0: don't.
#online_upnp = 1
# The UDP port internet play uses. 0: the game picks one. Forward it on your router if UPnP doesn't.
#online_tunnel_port = 0
# The lobby servers: host:port, separated by commas, no spaces. Set, it's used instead of brokers.txt beside
# the XBE (default: that file, else OpenCE's four, below).
#online_brokers = opence.milenko.org:1883,broker.emqx.io:1883,broker.hivemq.com:1883,test.mosquitto.org:1883
# The STUN servers that tell the game its public address.
#online_stun = stun.l.google.com:19302,stun.cloudflare.com:3478

# ---------- Showcase (the main menu's screensaver: a bot match with camera shots)

# 0: Halo's attract movies instead.
#showcase = 1
# Seconds the main menu waits for a press before it starts (5 and up).
#showcase_seconds = 75
# Each map plays at most this many seconds (15 to 3600). 0: no limit.
#showcase_map_seconds = 90
# Its bots, 0 to 15. Not set: the map's suggested players (4 to 10) less one.
#showcase_bots = 7
# Bots drop out one at a time while it runs under this many frames a second. 0: never.
#showcase_min_fps = 15
# White on a map in the map list previews its showcase.
#showcase_preview = 0
# The bot trainer: every map of showcase_playlist.ini plays for showcase_train_minutes so bots learn the maps
# (saved to bots_learned.txt / T:\bots_<map>.txt). showcase_seconds = 5 starts it soon after boot.
#showcase_train = 0
#showcase_train_minutes = 10

# ---------- Testing and map work

# The frame rate in the bottom right corner.
#fps_counter = 0
# Check every folder map in the background; the results go in map_check.txt.
#map_check = 0
# The bots' log: a line every 10 seconds in oxbox_log.txt, and opence_bot_log.txt (where bots gave up).
#bot_log = 0
# An FTP server on the game's folder while the menus are up (stopped while a map plays).
#ftp = 0
#ftp_password = xbox
#ftp_port = 21
# 0: no DirectSound effects (the audio chip's reverb), for a BIOS that doesn't take them.
#audio_effects = 1

# ---------- Developers

# The performance and memory log: a CSV file per map in perf\ beside the XBE.
#perf_log = 0
# A frame longer than this many milliseconds gets a line of its own.
#perf_slow_frame_ms = 34
# How often (ms, up to 100) the graphics chip is asked whether it's busy. 0: never.
#perf_gpu_sample_ms = 1
# The network test's lines on the main menu as well as in oxbox_log.txt.
#net_test_screen = 0
# The network test at start-up (DNS, STUN, the brokers), and XNet's security bypass for it.
#net_test = 1
#net_test_bypass = 1
# Join the first Xbox game listed online, to test the tunnel.
#net_test_join = 0
# A PC running the test's listener script, and its port.
#net_test_host = 192.168.1.10
#net_test_port = 5555
# Another DNS server for the test (default 8.8.8.8, then 1.1.1.1).
#net_test_dns = 8.8.8.8
# A fixed address (in its 255.255.255.0 network), no router.
#net_test_static = 192.168.1.20

# ---------- Other files the game reads

# showcase_playlist.ini        written by the game at the main menu: which maps the showcase and the trainer play
# d:\maps\bots\<map>.txt       bot nodes and links added to a stock map (never written by the game)
# <map folder>\bots.txt        the same for a folder map
# opence_settings.txt          written by the game's menus: leave it alone
